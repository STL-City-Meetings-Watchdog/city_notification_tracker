services:
  stl-meetings:
    container_name: stl-meetings-app-1
    build: ./stl-meetings/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${STL_MEETINGS_SMTP_USER}
      - SMTP_PASS=${STL_MEETINGS_SMTP_PASS}
      - BASE_URL=https://stlmeetings.veiledprofits.com
    volumes:
      - /root/stl-meetings/data:/app/data
      - /root/stl-meetings/data/pdfs:/app/pdfs
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stl-meetings.rule=Host(`stlmeetings.veiledprofits.com`)"
      - "traefik.http.routers.stl-meetings.entrypoints=websecure"
      - "traefik.http.routers.stl-meetings.tls.certresolver=letsencrypt"
      - "traefik.http.services.stl-meetings.loadbalancer.server.port=8000"

  stl-permits:
    container_name: stl-permits-app-1
    build: ./stl-permits/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${STL_PERMITS_SMTP_USER}
      - SMTP_PASS=${STL_PERMITS_SMTP_PASS}
      - BASE_URL=${STL_PERMITS_BASE_URL}
      - PROXY_BASE=${STL_PERMITS_PROXY_BASE}
      - DIGEST_HOUR=${DIGEST_HOUR:-7}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
    volumes:
      - /root/stl-permits/data:/app/data
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stl-permits.rule=Host(`permits.veiledprofits.com`)"
      - "traefik.http.routers.stl-permits.entrypoints=websecure"
      - "traefik.http.routers.stl-permits.tls.certresolver=letsencrypt"
      - "traefik.http.services.stl-permits.loadbalancer.server.port=8000"

  mo-permits:
    container_name: mo-permits-app
    build: ./mo-permits/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${MO_PERMITS_SMTP_USER}
      - SMTP_PASS=${MO_PERMITS_SMTP_PASS}
      - BASE_URL=https://mopermits.veiledprofits.com
      - CF_PROXY_URL=${CF_PROXY_URL:-}
    volumes:
      - /root/mo-permits/data:/app/data
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mo-permits.rule=Host(`mopermits.veiledprofits.com`)"
      - "traefik.http.routers.mo-permits.entrypoints=websecure"
      - "traefik.http.routers.mo-permits.tls.certresolver=letsencrypt"
      - "traefik.http.services.mo-permits.loadbalancer.server.port=8000"

networks:
  traefik-proxy:
    external: true
