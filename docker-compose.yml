services:
  stl-meetings:
    image: stl-meetings-${ENVIRONMENT_NICKNAME}
    container_name: stl-meetings-${ENVIRONMENT_NICKNAME}
    build: ./stl-meetings/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${STL_MEETINGS_SMTP_USER}
      - SMTP_PASS=${STL_MEETINGS_SMTP_PASS}
      - BASE_URL=https://stlmeetings.${TARGET_DOMAIN}
    volumes:
      - ${PERSISTENCE_DIR}/stl-meetings/data:/app/data
      - ${PERSISTENCE_DIR}/stl-meetings/data/pdfs:/app/pdfs
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stl-meetings-${ENVIRONMENT_NICKNAME}.rule=Host(`stlmeetings.${TARGET_DOMAIN}`)"
      - "traefik.http.routers.stl-meetings-${ENVIRONMENT_NICKNAME}.entrypoints=websecure"
      - "traefik.http.routers.stl-meetings-${ENVIRONMENT_NICKNAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.stl-meetings-${ENVIRONMENT_NICKNAME}.loadbalancer.server.port=8000"

  stl-permits:
    image: stl-permits-${ENVIRONMENT_NICKNAME}
    container_name: stl-permits-${ENVIRONMENT_NICKNAME}
    build: ./stl-permits/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${STL_PERMITS_SMTP_USER}
      - SMTP_PASS=${STL_PERMITS_SMTP_PASS}
      - BASE_URL=https://permits.${TARGET_DOMAIN}
      - PROXY_BASE=${STL_PERMITS_PROXY_BASE}
      - DIGEST_HOUR=${DIGEST_HOUR:-7}
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
    volumes:
      - ${PERSISTENCE_DIR}/stl-permits/data:/app/data
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stl-permits-${ENVIRONMENT_NICKNAME}.rule=Host(`permits.${TARGET_DOMAIN}`)"
      - "traefik.http.routers.stl-permits-${ENVIRONMENT_NICKNAME}.entrypoints=websecure"
      - "traefik.http.routers.stl-permits-${ENVIRONMENT_NICKNAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.stl-permits-${ENVIRONMENT_NICKNAME}.loadbalancer.server.port=8000"

  mo-permits:
    image: mo-permits-${ENVIRONMENT_NICKNAME}
    container_name: mo-permits-${ENVIRONMENT_NICKNAME}
    build: ./mo-permits/app
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${MO_PERMITS_SMTP_USER}
      - SMTP_PASS=${MO_PERMITS_SMTP_PASS}
      - BASE_URL=https://mopermits.${TARGET_DOMAIN}
      - CF_PROXY_URL=${CF_PROXY_URL:-}
    volumes:
      - ${PERSISTENCE_DIR}/mo-permits/data:/app/data
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mo-permits-${ENVIRONMENT_NICKNAME}.rule=Host(`mopermits.${TARGET_DOMAIN}`)"
      - "traefik.http.routers.mo-permits-${ENVIRONMENT_NICKNAME}.entrypoints=websecure"
      - "traefik.http.routers.mo-permits-${ENVIRONMENT_NICKNAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.mo-permits-${ENVIRONMENT_NICKNAME}.loadbalancer.server.port=8000"

networks:
  traefik-proxy:
    external: true
