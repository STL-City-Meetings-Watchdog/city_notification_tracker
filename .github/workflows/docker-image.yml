name: Docker Image CI

on:
  workflow_dispatch:
  push:
    #branches: [ "main" ]
    branches: [ "condensing_docker_compose" ]
    paths-ignore: 
      - '.github/**'
      - '.gitignore'
      - '.editorconfig'
      - '.LICENSE.md'
      - 'README.md'
      - '**docker-compose.yml'
  pull_request:
    branches: [ "condensing_docker_compose" ]
    #turn the above branch back to main later

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build the Docker image
    #need to check that these containers do spin up like they are supposed to,
    #and that this is all the containers we need to run
      run: docker compose up -d # I added this but this is a guess 
      #as to how to run docker compose to get it to do everything that I want

      
