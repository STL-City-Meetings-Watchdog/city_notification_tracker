name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "condensing_docker_compose" ]
    paths-ignore: 
      - '.github/**'
      - '.gitignore'
      - '.editorconfig'
      - '.LICENSE.md'
      - 'README.md'

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker compose up --build --detach

      
