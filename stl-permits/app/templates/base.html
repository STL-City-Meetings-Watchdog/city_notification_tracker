<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MO DNR Air Quality Permits{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #1a3a5c;
      --blue:   #1a5276;
      --mid:    #2874a6;
      --light:  #aed6f1;
      --bg:     #f4f6f9;
      --card:   #ffffff;
      --border: #dde3ea;
      --text:   #1c2b3a;
      --muted:  #6b7c93;
      --green:  #1e8449;
      --orange: #d35400;
      --red:    #922b21;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--mid); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    nav { background: var(--navy); color: #fff; padding: 0 24px; display: flex;
          align-items: center; justify-content: space-between; height: 56px;
          box-shadow: 0 2px 6px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-size: 1.1rem; font-weight: 700; letter-spacing: .3px; color: #fff; }
    .nav-brand span { color: var(--light); }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { color: #cce4f6; font-size: .9rem; transition: color .15s; }
    .nav-links a:hover { color: #fff; text-decoration: none; }
    .nav-links a.active { color: #fff; font-weight: 600; border-bottom: 2px solid var(--light); padding-bottom: 2px; }

    /* Layout */
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 1.5rem; color: var(--navy); font-weight: 700; }
    .page-header p  { color: var(--muted); margin-top: 4px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 20px; margin-bottom: 16px; }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { background: var(--blue); color: #fff; padding: 10px 12px; text-align: left;
         font-weight: 600; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: #f0f6fb; }
    tr:last-child td { border-bottom: none; }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .75rem;
             font-weight: 600; white-space: nowrap; }
    .badge-construction { background: #d6eaf8; color: #1a5276; }
    .badge-operating    { background: #d5f5e3; color: #1e8449; }
    .badge-part70       { background: #fdebd0; color: #d35400; }
    .badge-intermediate { background: #f9ebea; color: #922b21; }
    .badge-general      { background: #e8daef; color: #6c3483; }
    .badge-other        { background: #eaecee; color: #5d6d7e; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: 6px;
            color: var(--navy); }
    input[type=text], input[type=email], select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: .9rem; background: #fff;
      transition: border-color .15s; }
    input:focus, select:focus { outline: none; border-color: var(--mid); box-shadow: 0 0 0 3px rgba(40,116,166,.15); }
    .btn { display: inline-block; padding: 9px 20px; border-radius: 6px; font-size: .9rem;
           font-weight: 600; border: none; cursor: pointer; transition: background .15s; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--mid); color: #fff; text-decoration: none; }
    .btn-outline { background: transparent; color: var(--blue); border: 2px solid var(--blue); }
    .btn-outline:hover { background: var(--blue); color: #fff; text-decoration: none; }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: .9rem; }
    .alert-success { background: #d5f5e3; color: #1e8449; border: 1px solid #a9dfbf; }
    .alert-error   { background: #f9ebea; color: #922b21; border: 1px solid #f5c6cb; }
    .alert-info    { background: #d6eaf8; color: #1a5276; border: 1px solid #aed6f1; }

    /* Stat grid */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--blue); line-height: 1.1; }
    .stat-card .lbl { font-size: .8rem; color: var(--muted); margin-top: 4px; }

    /* Pagination */
    .pagination { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 24px; }
    .pagination a, .pagination span {
      padding: 6px 12px; border-radius: 4px; font-size: .875rem; border: 1px solid var(--border); }
    .pagination a { color: var(--blue); background: #fff; }
    .pagination a:hover { background: var(--blue); color: #fff; text-decoration: none; }
    .pagination span.current { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
    .pagination span.dots { border: none; color: var(--muted); }

    /* Footer */
    footer { text-align: center; padding: 28px 20px; color: var(--muted); font-size: .8rem;
             border-top: 1px solid var(--border); margin-top: 40px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">MO DNR <span>Air Permits</span></a>
    <ul class="nav-links">
      <li><a href="/" {% if request.endpoint=='index' %}class="active"{% endif %}>Home</a></li>
      <li><a href="/search" {% if request.endpoint=='search' %}class="active"{% endif %}>Issued</a></li>
      <li><a href="/pending" {% if request.endpoint=='pending' %}class="active"{% endif %}>Pending</a></li>
      <li><a href="/stats" {% if request.endpoint=='stats' %}class="active"{% endif %}>Stats</a></li>
      <li><a href="/subscribe" {% if request.endpoint=='subscribe' %}class="active"{% endif %}>Subscribe</a></li>
    </ul>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    Data sourced from <a href="https://dnr.mo.gov/air/business-industry/permits" target="_blank">Missouri DNR Air Pollution Control Program</a>.
    Not affiliated with the State of Missouri.
  </footer>
</body>
</html>
