<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STL Permits{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #666;
      --accent: #8b1e2d;
      --border: #e3e1dc;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: var(--fg);
      color: white;
      padding: 1rem 1.5rem;
    }
    header .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
    }
    header h1 a { color: white; }
    nav a {
      color: #ddd;
      margin-left: 1.5rem;
      font-size: 0.95rem;
    }
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    footer {
      max-width: 1100px;
      margin: 3rem auto 2rem;
      padding: 0 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
    }
    .card h3 {
      margin: 0 0 0.25rem;
      font-size: 1.05rem;
    }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
      background: #eee;
      font-size: 0.75rem;
      margin-right: 0.35rem;
    }
    .cost { font-weight: 600; color: var(--accent); }
    form { margin: 1rem 0; }
    input[type=text], input[type=email], input[type=number], select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
      min-width: 200px;
    }
    button {
      padding: 0.55rem 1rem;
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    .stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat .n { font-size: 1.6rem; font-weight: 600; }
    .stat .l { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .alert { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .alert.ok { background: #e6f4ea; border: 1px solid #b7e1c1; }
    .alert.err { background: #fde8e8; border: 1px solid #f5c2c2; }
    .desc { margin: 0.25rem 0 0; }
    .pagination { margin-top: 1.5rem; }
    .pagination a, .pagination span { margin-right: 0.5rem; padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 3px; }
    .pagination .current { background: var(--fg); color: white; border-color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1><a href="{{ url_for('index') }}">STL Permits</a></h1>
      <nav>
        <a href="{{ url_for('index') }}">Recent</a>
        <a href="{{ url_for('search') }}">Search</a>
        <a href="{{ url_for('subscribe') }}">Subscribe</a>
      </nav>
    </div>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <footer>
    Unofficial mirror of City of St. Louis building-permits open data.
    Data source: <a href="https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=1">stlouis-mo.gov/data</a>.
    Not affiliated with the City of St. Louis.
    <br><a href="https://github.com/STL-City-Meetings-Watchdog/city_notification_tracker">View source code</a>
  </footer>
</body>
</html>
