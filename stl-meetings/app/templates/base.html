<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}STL Meetings{% endblock %}</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:#333;background:#f5f5f5}
        .container{max-width:1000px;margin:0 auto;padding:20px}
        header{background:#1a365d;color:white;padding:20px 0;border-bottom:4px solid #c03221}
        header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
        header h1{font-size:1.5rem}
        header h1 a{color:white;text-decoration:none}
        nav a{color:white;text-decoration:none;margin-left:20px;opacity:0.9}
        nav a:hover{opacity:1}
        main{background:white;min-height:60vh;padding:30px 0}
        h2{color:#1a365d;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #e0e0e0}
        .meeting-card{border:1px solid #e0e0e0;border-radius:8px;padding:15px;margin-bottom:15px;background:#fafafa}
        .meeting-card:hover{border-color:#c03221}
        .meeting-card h3{color:#1a365d;margin-bottom:8px}
        .meeting-card h3 a{color:inherit;text-decoration:none}
        .meeting-card h3 a:hover{color:#c03221}
        .meeting-meta{font-size:0.9rem;color:#666}
        .meeting-meta span{margin-right:15px}
        .btn{display:inline-block;background:#c03221;color:white;padding:10px 20px;text-decoration:none;border-radius:5px;border:none;cursor:pointer;font-size:1rem}
        .btn:hover{background:#a02a1b}
        .btn-outline{background:transparent;border:2px solid #c03221;color:#c03221}
        .btn-outline:hover{background:#c03221;color:white}
        footer{background:#1a365d;color:white;padding:30px 0;margin-top:40px}
        footer a{color:#93c5fd}
        .search-box{display:flex;gap:10px;margin-bottom:30px}
        .search-box input{flex:1;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:1rem}
        form.subscribe-form{max-width:400px}
        form.subscribe-form label{display:block;margin-bottom:5px;font-weight:500}
        form.subscribe-form input[type="email"],form.subscribe-form select{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:5px;font-size:1rem}
        .alert{padding:15px;border-radius:5px;margin-bottom:20px}
        .alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
        .alert-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
        .doc-list{list-style:none}
        .doc-list li{padding:10px;border-bottom:1px solid #eee}
        .doc-list a{color:#1a365d;text-decoration:none}
        .doc-list a:hover{color:#c03221}
    </style>
</head>
<body>
    <header><div class="container">
        <h1><a href="/">📅 STL Meetings</a></h1>
        <nav><a href="/">Upcoming</a><a href="/search">Search</a><a href="/subscribe">Subscribe</a></nav>
    </div></header>
    <main><div class="container">{% block content %}{% endblock %}</div></main>
    <footer><div class="container">
        <p><strong>STL Meetings Archive</strong></p>
        <p>An unofficial archive of City of St. Louis public meeting notices.</p>
        <p>Built for civic transparency by <a href="https://veiledprofits.com">Veiled Profits</a></p>
        <p><a href="https://github.com/STL-City-Meetings-Watchdog/city_notification_tracker">Source code</a></p>
    </div></footer>
</body>
</html>
